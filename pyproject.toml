[project]
name = "dme"
version = "0.1.0"
description = "Distribution Matching Evolutionary Algorithms for rare event sampling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "filelock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dme"]
