[project]
name = "dme-lcb"
version = "0.1.0"
description = "DME and evolution strategy baselines on LiveCodeBench"
requires-python = "==3.11.*"
dependencies = [
    "dme",
    "vllm==0.19.1",
    "torch==2.10.0",
    "transformers==4.57.6",
    "datasets==3.5.0",
    "numpy==2.2.6",
    "filelock==3.32.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dme_lcb", "lcb_runner"]

[tool.uv.sources]
dme = { path = "../..", editable = true }

[tool.uv]
# The original environment had these installed despite other packages declaring incompatible ranges (e.g. datasets
# 3.5.0 declares dill<0.3.9), which worked in practice, so this forces the same versions
override-dependencies = [
    "dill==0.4.1",
    "fsspec==2026.7.0",
    "outlines-core==0.2.11",
    "nvidia-cutlass-dsl-libs-base==4.6.1",
    "apache-tvm-ffi==0.1.13.post0",
]
# Every other package pinned to the version in the environment the paper's LCB experiments were run in
