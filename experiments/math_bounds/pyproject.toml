[project]
name = "dme-math"
version = "0.1.0"
description = "DME and baselines on AlphaEvolve math bounds problems, sampling via Tinker"
requires-python = "==3.11.*"
dependencies = [
    "dme",
    "tinker==0.29.0",
    "transformers==5.17.0",
    "python-dotenv==1.2.3",
    "cloudpickle==3.1.2",
    "matplotlib==3.11.2",
    # also available to the generated programs, which are run with this environment's python
    "numpy==1.26.4",
    "scipy==1.15.3",
    "jax==0.7.1",
    "jaxlib==0.7.1",
    "autograd==1.9.1",
    "cma==4.5.0",
    "cmaes==0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dme_math"]

[tool.uv.sources]
dme = { path = "../..", editable = true }

[tool.uv]
# Every other package pinned to the version in the environment the paper's math bounds experiments were run in
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
