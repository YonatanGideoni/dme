[project]
name = "dme-regex"
version = "0.1.0"
description = "DME and baselines on the RegexEval regex task"
requires-python = "==3.10.*"
dependencies = [
    "dme",
    "vllm==0.11.2",
    "torch==2.9.0",
    "transformers==4.57.6",
    "datasets==4.6.1",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "filelock==3.24.3",
    # baselines
    "trl==0.29.0",
    "peft==0.18.1",
    "gepa==0.1.1",
    "requests==2.32.5",
]

[project.optional-dependencies]
wandb = ["wandb==0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dme_regex"]

[tool.uv.sources]
dme = { path = "../..", editable = true }

[tool.uv]
# The original environment had numpy 1.26.4 installed alongside packages declaring numpy>=2 (cupy, opencv), which
# worked in practice, so this forces the same numpy version
override-dependencies = ["numpy==1.26.4"]
